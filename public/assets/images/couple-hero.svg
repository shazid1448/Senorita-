<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5C1030" />
      <stop offset="60%" stop-color="#2E0A18" />
      <stop offset="100%" stop-color="#0B0710" />
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6FA5" />
      <stop offset="50%" stop-color="#E8A6C1" />
      <stop offset="100%" stop-color="#D4AF8C" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Romantic Night Background -->
  <circle cx="200" cy="200" r="196" fill="url(#bgGlow)" stroke="url(#roseGold)" stroke-width="4" />

  <!-- Ambient Golden Moon & Stars -->
  <circle cx="200" cy="110" r="50" fill="#F3E5AB" opacity="0.15" filter="url(#softGlow)" />
  <circle cx="90" cy="100" r="2" fill="#F3E5AB" opacity="0.8" />
  <circle cx="310" cy="90" r="2.5" fill="#FF6FA5" opacity="0.9" />
  <circle cx="280" cy="140" r="1.5" fill="#F3E5AB" opacity="0.7" />
  <circle cx="120" cy="150" r="2" fill="#E8A6C1" opacity="0.8" />

  <!-- Romantic Couple Silhouette -->
  <!-- Groom -->
  <path d="M120,380 C120,290 145,260 170,250 C160,240 155,220 155,200 C155,170 175,150 195,150 C205,150 215,155 220,165 C205,185 200,215 205,245 C208,255 215,262 225,268 C220,290 220,340 225,380 Z" fill="#200612" opacity="0.95" />
  <!-- Bride with hair flowing and head resting on his shoulder -->
  <path d="M280,380 C280,295 255,265 230,252 C240,240 245,215 240,195 C235,165 210,152 190,158 C185,160 180,165 178,170 C185,175 195,190 195,210 C195,230 185,245 175,252 C195,260 215,275 220,380 Z" fill="#3D0B20" opacity="0.95" />
  <!-- Glowing Rose/Gold Heart uniting them -->
  <path d="M200,245 C190,230 175,232 175,245 C175,258 200,275 200,275 C200,275 225,258 225,245 C225,232 210,230 200,245 Z" fill="url(#roseGold)" filter="url(#softGlow)" />

  <!-- Subtle floral wreath garland around the bottom -->
  <path d="M70,290 Q200,380 330,290" fill="none" stroke="url(#roseGold)" stroke-width="2" stroke-dasharray="4,6" opacity="0.6" />
</svg>
