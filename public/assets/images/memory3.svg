<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="60%" stop-color="#2c1a4d"/>
      <stop offset="100%" stop-color="#542344"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg3)" rx="20"/>
  <!-- Cherry Blossom Petals -->
  <g fill="#ff758c" opacity="0.85">
    <ellipse cx="120" cy="180" rx="14" ry="8" transform="rotate(25 120 180)"/>
    <ellipse cx="220" cy="130" rx="12" ry="7" transform="rotate(-35 220 130)"/>
    <ellipse cx="450" cy="190" rx="15" ry="9" transform="rotate(45 450 190)"/>
    <ellipse cx="380" cy="270" rx="13" ry="8" transform="rotate(15 380 270)"/>
    <ellipse cx="160" cy="340" rx="14" ry="7" transform="rotate(-20 160 340)"/>
    <ellipse cx="480" cy="370" rx="12" ry="8" transform="rotate(30 480 370)"/>
  </g>
  <!-- Big Glowing Heart in Center -->
  <g transform="translate(300, 260)">
    <circle cx="0" cy="0" r="100" fill="#e84393" opacity="0.25"/>
    <circle cx="0" cy="0" r="75" fill="#e84393" opacity="0.4"/>
    <!-- Intertwined Rings -->
    <circle cx="-25" cy="0" r="45" fill="none" stroke="#fcd34d" stroke-width="8"/>
    <circle cx="25" cy="0" r="45" fill="none" stroke="#fcd34d" stroke-width="8"/>
    <!-- Gem on Ring -->
    <polygon points="25,-55 35,-45 25,-35 15,-45" fill="#00ffff"/>
  </g>
  <!-- Text Label -->
  <text x="300" y="525" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#fcd34d" text-anchor="middle" letter-spacing="3">HAND IN HAND</text>
  <text x="300" y="555" font-family="'Great Vibes', cursive, sans-serif" font-size="22" fill="#ffe4e6" text-anchor="middle">Ready To Conquer The World Together 🤝</text>
</svg>