<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="candleLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffa65" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffaf40" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff3838" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg5)" rx="20"/>
  <!-- Warm Glow Core -->
  <circle cx="300" cy="270" r="160" fill="url(#candleLight)"/>
  <!-- Cozy Mug / Love Jar -->
  <g transform="translate(230, 200)">
    <rect x="20" y="40" width="100" height="110" rx="15" fill="#ffffff" opacity="0.9"/>
    <!-- Handle -->
    <path d="M120,60 C145,60 145,110 120,110" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.9"/>
    <!-- Heart on Mug -->
    <path d="M70,85 C70,75 55,75 55,87 C55,99 70,107 70,107 C70,107 85,99 85,87 C85,75 70,75 70,85 Z" fill="#e84393"/>
    <!-- Steam Rising as Hearts -->
    <path d="M60,25 C60,15 45,15 45,25 C45,35 60,42 60,42 C60,42 75,35 75,25 C75,15 60,15 60,25 Z" fill="#ff7675" transform="scale(0.5) translate(40,-10)"/>
    <path d="M80,0 C80,-10 65,-10 65,0 C65,10 80,17 80,17 C80,17 95,10 95,0 C95,-10 80,-10 80,0 Z" fill="#fab1a0" transform="scale(0.4) translate(110,-30)"/>
  </g>
  <!-- Text Label -->
  <text x="300" y="525" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#fcd34d" text-anchor="middle" letter-spacing="3">MY SAFE HAVEN</text>
  <text x="300" y="555" font-family="'Great Vibes', cursive, sans-serif" font-size="22" fill="#ffe4e6" text-anchor="middle">You Are My Peace &amp; Favorite Comfort 💫</text>
</svg>