<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a154b"/>
      <stop offset="35%" stop-color="#c23616"/>
      <stop offset="65%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg4)" rx="20"/>
  <!-- Sunset Sun -->
  <circle cx="300" cy="330" r="90" fill="#fff5cc" opacity="0.95"/>
  <!-- Ocean Horizon & Waves -->
  <rect x="0" y="380" width="600" height="220" fill="#1b1429"/>
  <path d="M0,380 C150,375 300,385 600,380 L600,600 L0,600 Z" fill="#1e152f"/>
  <!-- Sun Reflection on Water -->
  <ellipse cx="300" cy="400" rx="60" ry="4" fill="#fcd34d" opacity="0.8"/>
  <ellipse cx="300" cy="420" rx="80" ry="5" fill="#fcd34d" opacity="0.7"/>
  <ellipse cx="300" cy="445" rx="100" ry="5" fill="#fcd34d" opacity="0.6"/>
  <ellipse cx="300" cy="475" rx="120" ry="6" fill="#fcd34d" opacity="0.4"/>
  <!-- Flying Birds -->
  <path d="M120,160 Q130,150 140,160 Q150,150 160,160" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
  <path d="M160,130 Q168,122 176,130 Q184,122 192,130" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
  <!-- Text Label -->
  <text x="300" y="535" font-family="'Cinzel', Georgia, serif" font-size="22" font-weight="bold" fill="#fcd34d" text-anchor="middle" letter-spacing="3">GOLDEN MEMORIES</text>
  <text x="300" y="565" font-family="'Great Vibes', cursive, sans-serif" font-size="22" fill="#ffe4e6" text-anchor="middle">Every Sunset Is Sweeter With You 🌹</text>
</svg>