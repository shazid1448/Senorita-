<!doctype html>
<html lang="en" class="dark scroll-smooth" style="background-color: #0B0710;">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0710" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Our Story" />
    <meta name="description" content="A romantic celebration of love, eternal memories, and future promises." />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Performance: Preconnect & Non-blocking Google Fonts loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Manrope:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700&display=swap"
      />
    </noscript>

    <title>Shazid & Nithia — Our Endless Love Story</title>

    <style>
      /* Immediate 0ms Splash Animation while JS Bundle loads */
      @keyframes romanticPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .initial-splash {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0B0710;
        color: #E8A6C1;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .splash-heart {
        font-size: 42px;
        animation: romanticPulse 1.2s infinite ease-in-out;
        filter: drop-shadow(0 0 16px rgba(255, 111, 165, 0.6));
      }
      .splash-title {
        margin-top: 16px;
        font-size: 13px;
        letter-spacing: 3px;
        color: #D4AF8C;
        text-transform: uppercase;
        font-weight: 500;
      }
    </style>
  </head>
  <body style="background-color: #0B0710; margin: 0; padding: 0;" class="bg-romantic-bg text-romantic-text font-sans antialiased selection:bg-romantic-rose/30 selection:text-white min-h-[100svh] overflow-x-hidden transition-colors duration-500">
    <div id="root">
      <!-- Instant 0ms Preloader -->
      <div class="initial-splash">
        <div class="splash-heart">💖</div>
        <div class="splash-title">Shazid & Nithia</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Clean up legacy service workers to prevent cache trapping and blank screen issues
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var r of regs) { r.unregister(); }
        }).catch(function() {});
      }
    </script>
  </body>
</html>
